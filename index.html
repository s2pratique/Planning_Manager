<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>Formation Manager - Planning 2026</title>
  
  <!-- PWA Configuration -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;600;700&display=swap');
    
    :root {
      --midnight: #0f0f23;
      --deep-blue: #16213e;
      --accent-cyan: #00d9ff;
      --accent-pink: #ff006e;
      --accent-yellow: #ffbe0b;
      --text-primary: #ffffff;
      --text-secondary: #b0b0c0;
      --surface: #1a1a2e;
      --surface-light: #242438;
      --success: #06ffa5;
      --warning: #ffbe0b;
      --danger: #ff006e;
      
      /* Polices avec fallbacks */
      --font-display: 'Space Mono', 'Courier New', 'Consolas', monospace;
      --font-body: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--font-body);
      background: linear-gradient(135deg, var(--midnight) 0%, var(--deep-blue) 100%);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(0, 217, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 110, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(255, 190, 11, 0.05) 0%, transparent 50%);
      pointer-events: none;
      animation: pulse 15s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }
    
    /* Header */
    header {
      text-align: center;
      margin-bottom: 3rem;
      animation: slideDown 0.6s ease-out;
    }
    
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    
    .subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      font-weight: 300;
    }
    
    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
      animation: fadeIn 0.8s ease-out 0.2s both;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .stat-card {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .stat-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-cyan);
      box-shadow: 0 10px 40px rgba(0, 217, 255, 0.2);
    }
    
    .stat-card:hover::before {
      opacity: 1;
    }
    
    .stat-value {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-yellow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    
    .stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      animation: fadeIn 1s ease-out 0.4s both;
    }
    
    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }
    
    .search-box input {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    
    .search-box input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
    }
    
    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
    }
    
    .filter-group {
      display: flex;
      gap: 0.5rem;
    }
    
    select, .btn {
      padding: 1rem 1.5rem;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }
    
    select:hover, .btn:hover {
      border-color: var(--accent-cyan);
      background: var(--surface-light);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      border: none;
      color: white;
      font-weight: 600;
      position: relative;
      overflow: hidden;
    }
    
    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
    }
    
    .btn-primary:hover::before {
      left: 100%;
    }
    
    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(0, 217, 255, 0.3);
    }
    
    /* View Toggle */
    .view-toggle {
      display: flex;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }
    
    .view-toggle button {
      padding: 1rem 1.5rem;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: var(--font-body);
      font-weight: 500;
    }
    
    .view-toggle button.active {
      background: var(--accent-cyan);
      color: var(--midnight);
      font-weight: 600;
    }
    
    /* Calendar View */
    .calendar-view {
      animation: fadeIn 0.6s ease-out;
    }
    
    .month-section {
      margin-bottom: 3rem;
      background: var(--surface);
      border-radius: 20px;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .month-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .month-title::before {
      content: '📅';
      font-size: 1.5rem;
    }
    
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }
    
    .day-card {
      background: var(--surface-light);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }
    
    .day-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
    }
    
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .day-date {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.1rem;
    }
    
    .day-name {
      color: var(--text-secondary);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .session-item {
      background: rgba(0, 217, 255, 0.1);
      border-left: 3px solid var(--accent-cyan);
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      border-radius: 6px;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    
    .session-item:hover {
      background: rgba(0, 217, 255, 0.2);
      transform: translateX(5px);
    }
    
    .session-trainer {
      font-weight: 600;
      color: var(--accent-cyan);
      margin-bottom: 0.25rem;
    }
    
    .session-type {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    
    .session-lieu {
      display: inline-block;
      background: rgba(255, 190, 11, 0.2);
      color: var(--accent-yellow);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-top: 0.5rem;
      font-weight: 600;
    }
    
    /* Table View */
    .table-view {
      animation: fadeIn 0.6s ease-out;
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--surface);
      border-radius: 16px;
      overflow: hidden;
    }
    
    thead {
      background: var(--surface-light);
    }
    
    th {
      padding: 1.25rem 1rem;
      text-align: left;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      color: var(--accent-cyan);
      border-bottom: 2px solid var(--accent-cyan);
    }
    
    td {
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    tbody tr {
      transition: background 0.2s ease;
    }
    
    tbody tr:hover {
      background: var(--surface-light);
    }
    
    .status-badge {
      display: inline-block;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .status-planifie {
      background: rgba(6, 255, 165, 0.2);
      color: var(--success);
    }
    
    .status-ferie {
      background: rgba(255, 190, 11, 0.2);
      color: var(--accent-yellow);
    }
    
    .status-conges {
      background: rgba(255, 0, 110, 0.2);
      color: var(--accent-pink);
    }
    
    /* Loading */
    .loading {
      text-align: center;
      padding: 4rem 2rem;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease-out;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: var(--surface);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 600px;
      width: 90%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      animation: slideUp 0.4s ease-out;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    
    .modal-title {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .close-modal {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 2rem;
      cursor: pointer;
      padding: 0;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.3s ease;
    }
    
    .close-modal:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      transform: rotate(90deg);
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 1rem;
      background: var(--surface-light);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
    }
    
    .modal-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }
    
    .modal-actions button {
      flex: 1;
    }
    
    .btn-secondary {
      background: var(--surface-light);
      color: var(--text-primary);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      .controls {
        flex-direction: column;
      }
      
      .filter-group {
        width: 100%;
      }
      
      .filter-group select,
      .filter-group button {
        flex: 1;
      }
      
      .calendar-grid {
        grid-template-columns: 1fr;
      }
      
      .modal-content {
        padding: 1.5rem;
      }
    }
    
    /* Utility */
    .hidden {
      display: none !important;
    }
    
    .text-center {
      text-align: center;
    }
    
    .mt-2 {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Formation Manager</h1>
      <p class="subtitle">Planning & Gestion des formations 2026</p>
    </header>

    <!-- Statistics -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-sessions">-</div>
        <div class="stat-label">Sessions planifiées</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-trainers">-</div>
        <div class="stat-label">Formateurs actifs</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-upcoming">-</div>
        <div class="stat-label">À venir ce mois</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-status">✓</div>
        <div class="stat-label">Statut système</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Rechercher une formation, un formateur...">
      </div>
      
      <div class="filter-group">
        <select id="trainerFilter">
          <option value="">Tous les formateurs</option>
        </select>
        
        <select id="monthFilter">
          <option value="">Tous les mois</option>
        </select>
      </div>
      
      <div class="view-toggle">
        <button class="active" data-view="calendar">📅 Calendrier</button>
        <button data-view="table">📊 Tableau</button>
      </div>
      
      <button class="btn btn-primary" id="btnAddSession">+ Nouvelle session</button>
      <button class="btn" id="btnRefresh">🔄 Actualiser</button>
    </div>

    <!-- Loading State -->
    <div class="loading" id="loadingState">
      <div class="spinner"></div>
      <p>Chargement des données...</p>
    </div>

    <!-- Calendar View -->
    <div id="calendarView" class="calendar-view hidden"></div>

    <!-- Table View -->
    <div id="tableView" class="table-view hidden"></div>
  </div>

  <!-- Add/Edit Session Modal -->
  <div class="modal" id="sessionModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Nouvelle session</h2>
        <button class="close-modal" id="closeModal">×</button>
      </div>
      
      <form id="sessionForm">
        <div class="form-group">
          <label for="sessionDate">Date</label>
          <input type="date" id="sessionDate" required>
        </div>
        
        <div class="form-group">
          <label for="sessionTrainer">Formateur</label>
          <select id="sessionTrainer" required>
            <option value="">Sélectionner un formateur</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="sessionType">Type de formation</label>
          <input type="text" id="sessionType" placeholder="Ex: CACES R489" required>
        </div>
        
        <div class="form-group">
          <label for="sessionLieu">Lieu</label>
          <select id="sessionLieu">
            <option value="INTER BENESSE">INTER BENESSE</option>
            <option value="INTER BAYONNE">INTER BAYONNE</option>
            <option value="INTRA">INTRA</option>
            <option value="BIDART">BIDART</option>
            <option value="Autre">Autre</option>
          </select>
        </div>
        
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelSession">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
